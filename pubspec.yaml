name: mitsumori_seikyu
description: "一人親方・小規模事業者向け。見積書と請求書を現場で作ってPDFで送る。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.6
  path: ^1.9.1
  share_plus: ^13.3.1
  pdf: ^3.13.1
  printing: ^5.14.2
  url_launcher: ^6.3.2
  in_app_purchase: ^3.3.1
  in_app_purchase_storekit: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  image: ^4.10.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/NotoSansJP-Regular.ttf
    - assets/fonts/NotoSansJP-Bold.ttf
